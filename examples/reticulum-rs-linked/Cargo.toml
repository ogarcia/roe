# Example: Reticulum-rs talking RoE with the reticulum-over-ethernet crate
# linked in, without the roe helper process.
#
# The crate is GPL-3.0-or-later, so a binary built from this is too. See
# README.md.
[package]
name = "roe-example-reticulum-rs-linked"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# A standalone package, not a member of the roe crate.
[workspace]

[dependencies]
reticulum-over-ethernet = { path = "../.." }
# Pinned to a known commit: Reticulum-rs has no recent release on crates.io.
reticulum = { git = "https://github.com/BeechatNetworkSystemsLtd/Reticulum-rs", rev = "151e3b6" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rand_core = { version = "0.6", features = ["getrandom"] }
log = "0.4"
env_logger = "0.10"
