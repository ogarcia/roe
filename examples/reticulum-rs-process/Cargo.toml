# Example: Reticulum-rs talking RoE through the roe helper process.
#
# Not part of the reticulum-over-ethernet crate, and not linked against it:
# it starts the `roe` binary and exchanges packets with it over a socket
# pair, so it can use any license. See README.md.
[package]
name = "roe-example-reticulum-rs-process"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# A standalone package, not a member of the roe crate.
[workspace]

[dependencies]
# Pinned to a known commit: Reticulum-rs has no recent release on crates.io.
reticulum = { git = "https://github.com/BeechatNetworkSystemsLtd/Reticulum-rs", rev = "151e3b6" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rand_core = { version = "0.6", features = ["getrandom"] }
libc = "0.2"
log = "0.4"
env_logger = "0.10"
