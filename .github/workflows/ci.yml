name: CI

on:
  push:
    branches: [master]
    # Releases are tagged with the bare version: 0.1.0, 0.2.0, 0.2.1...
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RNS_VERSION: "1.6.0"

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # No Python lockfile to key a cache on: only ruff and a pinned rns.
          enable-cache: false
      - name: Ruff
        run: |
          mapfile -t py < <(git ls-files '*.py')
          uvx ruff check "${py[@]}"
          uvx ruff format --check "${py[@]}"

  build:
    name: Build ${{ matrix.arch }}
    # Native runner for each architecture, as for the end-to-end tests.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      # pack.sh builds the static musl binary and the test bundle.
      - run: scripts/pack.sh ${{ matrix.arch }}
      - name: Collect binary
        run: |
          mkdir -p out
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/roe out/roe
          file out/roe
      - uses: actions/upload-artifact@v7
        with:
          name: roe-${{ matrix.arch }}-linux-musl
          path: out/roe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: dist/roe-*-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  e2e:
    name: End-to-end tests (${{ matrix.arch }})
    # Native runners for each architecture: on arm64 this exercises the real
    # kernel, including the multicast group membership that qemu user mode
    # cannot set.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # No Python lockfile to key a cache on: only ruff and a pinned rns.
          enable-cache: false
      - name: Allow unprivileged user namespaces
        # Ubuntu restricts them through AppArmor; the tests rely on them to
        # create network namespaces without root.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Reticulum
        run: uv venv && uv pip install "rns==$RNS_VERSION"
      - run: tests/netns.sh
      - run: tests/bundle.sh
      - run: tests/multihop.sh
      - run: tests/robustness.sh
      - run: tests/mtu.sh
      - run: tests/ifac.sh
      - run: tests/bridge.sh
      - run: tests/vlan.sh
      - run: tests/unicast.sh

  container:
    name: Container (${{ matrix.arch }})
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-26.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The image takes the binary built and tested by the build job.
      - uses: actions/download-artifact@v8
        with:
          name: roe-${{ matrix.arch }}-linux-musl
          path: container
      - run: chmod 755 container/roe
      # Builds the image and runs two RoE nodes in containers. Rootful
      # podman: rootless networking gives no layer 2 access.
      - run: tests/container.sh
        env:
          ENGINE: sudo podman
      # On pushes, publish the tested image for this architecture as
      # <branch or tag>-<platform>; container-manifest joins them.
      - name: Push image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.platform }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sudo podman tag roe-test "$IMAGE"
          sudo podman push "$IMAGE"

  container-manifest:
    name: Container manifest
    if: github.event_name == 'push'
    needs: container
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # All tags, to tell whether this one is the highest version.
      - uses: actions/checkout@v7
        if: github.ref_type == 'tag'
        with:
          fetch-depth: 0
      # One multi-architecture image, ghcr.io/<repo>:<branch or tag>, so
      # that pulls get the image for their own architecture.
      - name: Push multi-architecture image
        run: |
          echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman manifest create "$IMAGE"
          for platform in amd64 arm64; do
            podman manifest add "$IMAGE" "docker://$IMAGE-$platform"
          done
          podman manifest inspect "$IMAGE"
          podman manifest push --all "$IMAGE" "docker://$IMAGE"
      # latest follows the highest release, not the last tag pushed: a fix
      # tagged on an older series does not move it back. Pre-releases
      # (0.2.0-rc1) are left out, as version sorting would put them first.
      - name: Push latest
        if: github.ref_type == 'tag'
        run: |
          highest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          echo "this tag: $GITHUB_REF_NAME, highest release: $highest"
          if [ "$GITHUB_REF_NAME" = "$highest" ]; then
            podman manifest push --all "$IMAGE" "docker://ghcr.io/$GITHUB_REPOSITORY:latest"
          else
            echo "not the highest release, latest stays where it is"
          fi

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, build, e2e]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir release
          for arch in x86_64 aarch64; do
            cp "artifacts/roe-$arch-linux-musl/roe" "release/roe-$arch-linux-musl"
            cp artifacts/bundle-$arch/*.tar.gz release/
          done
          cd release && sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
